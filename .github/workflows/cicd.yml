name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run Python Tests (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install xlrd

      - name: Run Unit Tests
        run: |
          python -m unittest test_server.py

  deploy:
    name: Deploy to Contabo VM (CD)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            echo "Conectado al servidor. Iniciando actualización..."
            cd /root/app-dao-metricas
            
            # Traer los últimos cambios de GitHub
            git fetch --all
            git reset --hard origin/master
            
            # Reconstruir y levantar el stack de Docker
            docker compose up -d --build
            
            echo "¡Despliegue finalizado con éxito!"
