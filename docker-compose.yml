version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  app:
    build: .
    container_name: dao-metricas-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Limit resources to prevent DoS or leaks
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - app-network
    volumes:
      # Persistent storage for Excel database (shared with host for backups)
      - excel-data:/app
    environment:
      - PORT=8000

  web:
    image: nginx:alpine-slim
    container_name: dao-metricas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - app-network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  excel-data:
